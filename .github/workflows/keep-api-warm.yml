name: Keep API warm

# Pings the Render API so free-tier instances do not sleep as often.
# Uses free GitHub Actions minutes; keeps one Render free instance within ~750h/month.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render API
        run: |
          set -e
          curl -fsS --max-time 90 "https://bu-papers-ready.onrender.com/api/v1/health" || true
          curl -fsS --max-time 90 "https://bu-papers-ready.onrender.com/api/v1/public/home?latestLimit=1&popularLimit=1" >/dev/null
          echo "API warm ping ok"
