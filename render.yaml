services:
  - type: web
    name: bu-papers-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: MONGODB_DB_NAME
        value: arms
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_FOLDER
        value: arms
      - key: COOKIE_SECURE
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: SUPER_ADMIN_2FA_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_BASE_URL
        sync: false
