services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3008:3008"
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3008
      - FRONTEND_URL=http://localhost:3011
      - CORS_ORIGINS=http://localhost:3011
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3011:3011"
    depends_on:
      - backend
    restart: unless-stopped
